[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-legal-move-models"
version = "1.0.0"
description = "Reproducible SFT and vLLM evaluation for legal chess-move enumeration from FEN."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "pandas>=2.2,<3",
  "python-chess>=1.999,<2",
  "PyYAML>=6,<7",
  "tqdm>=4.66,<5",
  "zstandard>=0.22,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]
training = [
  "accelerate>=0.34,<2",
  "datasets>=2.16,<4",
  "peft>=0.18,<1",
  "protobuf>=4,<7",
  "sentencepiece>=0.2,<1",
  "transformers>=4.45,<6",
]
publication = [
  "aiohttp>=3.10,<4",
  "nvidia-ml-py>=12,<14",
  "transformers==5.14.1",
]
analysis = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["analysis*", "fen_move_colab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
